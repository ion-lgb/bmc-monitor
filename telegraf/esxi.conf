# ESXi SNMP 采集 —— 基于 marjan-mesgarani/Telegraf-Config-Files 的 esxi.conf
# https://github.com/marjan-mesgarani/Telegraf-Config-Files/tree/main/ESXi%20Hypervisor
# 配套看板:https://grafana.com/grafana/dashboards/18839
#
# 凭据用 $VAR 引用,实际值放在 .snmp-creds(600 权限,已 gitignore),
# 由 docker-compose 以环境变量注入,不落在这个文件里。

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  omit_hostname = true

# 输出到 Prometheus:暴露 /metrics 供现有的 Prometheus 抓取,不需要 InfluxDB。
# metric_version = 1 是刻意的 —— 它会把 nic_desc / storage_desc / vm_state /
# vm_guest_os 这些**字符串字段转成 Prometheus label**,而看板 18839 的查询
# 正是靠这些 label 过滤的(如 storage_desc="Real Memory"、vm_state="powered on")。
# 换成 metric_version = 2 会把字符串字段丢掉,看板会大面积没数据。
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 1
  string_as_label = true
  export_timestamp = false

[[inputs.snmp]]
  name_override = "esxi_snmp"
  agents = [ "$ESXI_HOST:161" ]
  interval = "1m"
  version = 3
  community = "public"
  sec_name = "$SNMP_USER"
  auth_protocol = "SHA"
  auth_password = "$SNMP_AUTH_PASS"
  sec_level = "authPriv"
  context_name = ""
  priv_protocol = "AES"
  priv_password = "$SNMP_PRIV_PASS"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = ".1.3.6.1.2.1.1.5.0"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.25.1.1.0"

  [[inputs.snmp.field]]
    name = "model"
    oid = ".1.3.6.1.2.1.47.1.1.1.1.2.1"

  [[inputs.snmp.field]]
    name = "desc"
    oid = ".1.3.6.1.2.1.1.1.0"

  [[inputs.snmp.table]]
    name = "if_nic"
    # index_as_tag 必须加:SNMP 表的每一行都要有唯一标识,否则同一张表的所有行
    # tag 完全相同,在 Prometheus 输出时互相覆盖,最后只剩一条。
    # (上游原配置只给 hr_processor 加了,其余表都漏了 —— 实测 5 台虚拟机只出 1 条)
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "nic_desc"
      oid = ".1.3.6.1.2.1.2.2.1.2"

    [[inputs.snmp.table.field]]
      name = "nic_state"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "nic_speed"
      oid = ".1.3.6.1.2.1.2.2.1.5"

  [[inputs.snmp.table]]
    name = "ifx_nic"
    # index_as_tag 必须加:SNMP 表的每一行都要有唯一标识,否则同一张表的所有行
    # tag 完全相同,在 Prometheus 输出时互相覆盖,最后只剩一条。
    # (上游原配置只给 hr_processor 加了,其余表都漏了 —— 实测 5 台虚拟机只出 1 条)
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "nic_name"
      oid = ".1.3.6.1.2.1.31.1.1.1.1"

    [[inputs.snmp.table.field]]
      name = "nic_bytes_in"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "nic_bytes_out"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

  [[inputs.snmp.table]]
    name = "hr_storage"
    # index_as_tag 必须加:SNMP 表的每一行都要有唯一标识,否则同一张表的所有行
    # tag 完全相同,在 Prometheus 输出时互相覆盖,最后只剩一条。
    # (上游原配置只给 hr_processor 加了,其余表都漏了 —— 实测 5 台虚拟机只出 1 条)
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "storage_type"
      oid = ".1.3.6.1.2.1.25.2.3.1.2"

    [[inputs.snmp.table.field]]
      name = "storage_desc"
      oid = ".1.3.6.1.2.1.25.2.3.1.3"

    [[inputs.snmp.table.field]]
      name = "storage_allocation_units"
      oid = ".1.3.6.1.2.1.25.2.3.1.4"

    [[inputs.snmp.table.field]]
      name = "storage_size"
      oid = ".1.3.6.1.2.1.25.2.3.1.5"

    [[inputs.snmp.table.field]]
      name = "storage_used"
      oid = ".1.3.6.1.2.1.25.2.3.1.6"

  [[inputs.snmp.table]]
    name = "hr_processor"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "processor_load"
      oid = ".1.3.6.1.2.1.25.3.3.1.2"

  [[inputs.snmp.field]]
    name = "hba_number"
    oid = ".1.3.6.1.4.1.6876.3.5.1.0"

  [[inputs.snmp.table]]
    name = "vmw_hba"
    # index_as_tag 必须加:SNMP 表的每一行都要有唯一标识,否则同一张表的所有行
    # tag 完全相同,在 Prometheus 输出时互相覆盖,最后只剩一条。
    # (上游原配置只给 hr_processor 加了,其余表都漏了 —— 实测 5 台虚拟机只出 1 条)
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "hba_device_name"
      oid = ".1.3.6.1.4.1.6876.3.5.2.1.2"

    [[inputs.snmp.table.field]]
      name = "hba_bus_number"
      oid = ".1.3.6.1.4.1.6876.3.5.2.1.3"

    [[inputs.snmp.table.field]]
      name = "hba_status"
      oid = ".1.3.6.1.4.1.6876.3.5.2.1.4"

    [[inputs.snmp.table.field]]
      name = "hba_model_name"
      oid = ".1.3.6.1.4.1.6876.3.5.2.1.5"

    [[inputs.snmp.table.field]]
      name = "hba_driver_name"
      oid = ".1.3.6.1.4.1.6876.3.5.2.1.6"

  [[inputs.snmp.table]]
    name = "vmw_vm"
    # index_as_tag 必须加:SNMP 表的每一行都要有唯一标识,否则同一张表的所有行
    # tag 完全相同,在 Prometheus 输出时互相覆盖,最后只剩一条。
    # (上游原配置只给 hr_processor 加了,其余表都漏了 —— 实测 5 台虚拟机只出 1 条)
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "vm_display_name"
      oid = ".1.3.6.1.4.1.6876.2.1.1.2"

    [[inputs.snmp.table.field]]
      name = "vm_guest_os"
      oid = ".1.3.6.1.4.1.6876.2.1.1.4"

    [[inputs.snmp.table.field]]
      name = "vm_mem_size"
      oid = ".1.3.6.1.4.1.6876.2.1.1.5"

    [[inputs.snmp.table.field]]
      name = "vm_state"
      oid = ".1.3.6.1.4.1.6876.2.1.1.6"

    [[inputs.snmp.table.field]]
      name = "vm_guest_os_state"
      oid = ".1.3.6.1.4.1.6876.2.1.1.8"

    [[inputs.snmp.table.field]]
      name = "vm_num_cpu"
      oid = ".1.3.6.1.4.1.6876.2.1.1.9"
