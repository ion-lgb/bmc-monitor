networks:
  monitoring:

volumes:
  prometheus_data:
  grafana_data:

services:
  ipmi-exporter:
    image: quay.io/prometheuscommunity/ipmi-exporter:v1.10.1
    container_name: ipmi-exporter
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    command:
      - --config.file=/config/ipmi.yml
    volumes:
      # 挂目录而不是挂单个文件:bmc-manager 用「临时文件 + 原子替换」的方式
      # 更新配置,替换会产生新的 inode。Docker 的单文件 bind mount 绑的是
      # inode,替换之后容器里看到的会永远是旧文件(这个坑踩过一次)。
      - ./ipmi_exporter:/config:ro
    ports:
      - "9290:9290"
    networks:
      - monitoring

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --log.level=info
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # 开给 bmc-manager 用:删除服务器时能立刻把它的历史数据也物理清掉,
      # 而不是只停止采集。这个接口没有认证,谁都能删任意历史数据,
      # 只在"仅内网访问"的前提下开着才安全。
      - --web.enable-admin-api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - ipmi-exporter
      - alertmanager

  alert-webhook:
    build: ./alert-webhook
    container_name: alert-webhook
    restart: unless-stopped
    environment:
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - DINGTALK_SECRET=${DINGTALK_SECRET:-}
      - WECHAT_WEBHOOK=${WECHAT_WEBHOOK:-}
      - TZ=Asia/Shanghai
    ports:
      # 5001 只用于手动触发测试通知(/test),仅绑定本机,公网不可达
      - "127.0.0.1:5001:5001"
    networks:
      - monitoring

  bmc-manager:
    build: ./bmc-manager
    container_name: bmc-manager
    restart: unless-stopped
    environment:
      - IPMI_CONFIG_PATH=/config/ipmi.yml
      - TARGETS_PATH=/targets/bmc-targets.json
      - IPMI_EXPORTER_URL=http://ipmi-exporter:9290
      - PROMETHEUS_URL=http://prometheus:9090
      - TZ=Asia/Shanghai
    volumes:
      # 同样挂目录:原子替换需要在目标文件所在目录里创建临时文件。
      - ./ipmi_exporter:/config:rw
      - ./prometheus/targets:/targets:rw
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      - ipmi-exporter
      - prometheus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ESXi 监控(可选)。通过 SNMP v3 采集 ESXi 主机,用 prometheus_client 输出,
  # 由上面的 Prometheus 直接抓 —— 不需要 InfluxDB。
  # 前提:ESXi 上要先启用 SNMP,见 telegraf/setup_snmp.py。
  telegraf:
    image: telegraf:1.32
    container_name: telegraf
    restart: unless-stopped
    environment:
      - ESXI_HOST=${ESXI_HOST}
      - SNMP_USER=${SNMP_USER}
      - SNMP_AUTH_PASS=${SNMP_AUTH_PASS}
      - SNMP_PRIV_PASS=${SNMP_PRIV_PASS}
      - TZ=Asia/Shanghai
    volumes:
      - ./telegraf/esxi.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - TZ=Asia/Shanghai
      # 不设这个的话,「分享」出来的链接会是 http://localhost:3000/...,
      # 别人打开是空白;而且页面里部分资源和跳转也会指向 localhost,
      # 表现为"打开很久才出数据"。必须填这台机器在网络里的真实地址。
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      # 匿名只读:打开链接不用登录,但只能看不能改(Viewer 角色)。
      # 管理员仍可从右上角登录进去编辑。
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      # 匿名用户看不到版本号等无谓信息
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      # --- 公网反代加固 ---
      # 关掉公网分享/快照/嵌入,避免匿名者把看板内容扩散出去
      - GF_SNAPSHOTS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      # 防止匿名者通过数据源代理拿 Prometheus 数据做恶意大查询
      - GF_SERVER_ENFORCE_DOMAIN=true
      # cookie 只在 HTTPS 下传输(前面 Nginx 终止 TLS),并限制同站
      - GF_SERVER_COOKIE_SECURE=true
      - GF_SERVER_COOKIE_SAMESITE=strict
      - GF_SECURITY_CSRF_ALWAYS_CHECK=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
