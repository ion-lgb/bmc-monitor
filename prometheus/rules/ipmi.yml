# IPMI / BMC 告警规则。
# 说明:
#   - ipmi_sensor_state 正常为 0,非 0 表示离散传感器处于异常状态;
#   - ipmi_temperature_celsius 里带 limit 的是阈值/参考常量,不是实测温度,统一排除;
#   - 温度类告警留了 5 分钟确认时间,避免瞬时抖动误报。
groups:
  - name: ipmi-bmc
    rules:
      - alert: BMCUnreachable
        expr: up{job="ipmi"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BMC 失联: {{ $labels.instance }}"
          description: "BMC {{ $labels.instance }} 已连续 2 分钟抓取失败。检查网络、BMC 管理口和凭据。"

      - alert: BMCReachableWithPartialFailure
        expr: (up{job="ipmi"} == 1) and (min by (instance) (ipmi_up{job="ipmi"}) < 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BMC 部分采集器异常: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 可达,但部分 IPMI 采集器持续失败,通常是该机型不支持某采集器或 session 槽位不足。"

      - alert: CpuTemperatureHigh
        expr: max by (instance) (ipmi_temperature_celsius{name=~"(?i).*cpu.*temp", name!~"(?i).*limit|.*tlimit|.*max|.*min|.*dimm|.*vrm.*"}) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 温度过高: {{ $labels.instance }} {{ $value }}°C"
          description: "{{ $labels.instance }} 某颗 CPU 温度超过 90°C,请检查散热/风扇。"

      - alert: GpuTemperatureHigh
        expr: max by (instance) (ipmi_temperature_celsius{name=~"(?i).*gpu.*temp", name!~"(?i).*limit|.*tlimit|.*max|.*min.*"}) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 温度过高: {{ $labels.instance }} {{ $value }}°C"
          description: "{{ $labels.instance }} 某片 GPU 温度超过 90°C,请检查散热/风扇。"

      - alert: FanSensorCritical
        expr: ipmi_sensor_state{name=~"(?i).*fan.*"} != 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "风扇传感器异常: {{ $labels.instance }} {{ $labels.name }}"
          description: "{{ $labels.instance }} 的风扇传感器 {{ $labels.name }} 状态非正常。"

      - alert: PsuSensorCritical
        expr: ipmi_sensor_state{name=~"(?i).*psu.*"} != 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "电源传感器异常: {{ $labels.instance }} {{ $labels.name }}"
          description: "{{ $labels.instance }} 的电源传感器 {{ $labels.name }} 状态非正常。"

      - alert: AlertWebhookDown
        expr: up{job="alert-webhook"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "告警转发服务不可用"
          description: "alert-webhook 已连续 2 分钟抓取失败,钉钉/企业微信通知将无法送达。"

      - alert: AlertDeliveryFailed
        expr: increase(alert_webhook_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "群机器人推送失败"
          description: "近 15 分钟内 alert-webhook 向群机器人推送失败,请检查 webhook 是否被禁用/失效。"

      - alert: MemorySensorCritical
        expr: ipmi_sensor_state{type="Memory"} != 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "内存传感器异常: {{ $labels.instance }} {{ $labels.name }}"
          description: "{{ $labels.instance }} 的内存插槽 {{ $labels.name }} 状态非正常(ECC 报警/预测性故障)。"
