global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # IPMI 多目标采集:目标列表由 bmc-manager 网页维护,写在
  # targets/bmc-targets.json 里(file_sd)。Prometheus 会自己监听这个文件的变化,
  # 加/删服务器不需要重启或 reload Prometheus。
  #
  # 采集频率的取舍:实测一台正常机器抓一轮约 1.1 秒(见 ipmi_scrape_duration_seconds),
  # 15s 间隔的占空比不到 10%,不会把 BMC 的 session 表打满。
  # 超时收到 10s:连不上的 BMC 早点失败,不要占着 session 拖慢别人 —— 之前 20s
  # 超时会让一台失联的机器每轮都卡满 20 秒。
  # 注意 scrape_timeout 必须 ≤ scrape_interval。
  - job_name: ipmi
    metrics_path: /ipmi
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/bmc-targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [bmc_module]
        target_label: __param_module
      - target_label: __address__
        replacement: ipmi-exporter:9290
      # bmc_module 只是用来生成上面的 __param_module,不应该留成普通标签存进
      # Prometheus(否则每次改配置、标签值一变,就会跟旧数据断成两条序列)。
      - action: labeldrop
        regex: bmc_module
